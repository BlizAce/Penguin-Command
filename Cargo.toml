[package]
name = "penguin-command"
version = "0.1.0"
edition = "2021"
description = "A terminal with a built-in AI agent — works inside any terminal, on any OS."
license = "MIT"

[[bin]]
name = "pc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
portable-pty = "0.8"
vte = "0.14"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
regex = "1"
walkdir = "2"
dirs = "5"
wait-timeout = "0.2"
tokio = { version = "1", features = ["rt", "time", "macros"] }
futures-util = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
